<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 340px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #1a1a1a;
    background: #fafafa;
    padding: 16px;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 11px;
    color: #888;
    margin-bottom: 16px;
  }
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .toggle-label { font-weight: 600; }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
  }
  .toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ccc;
    border-radius: 24px;
    transition: 0.2s;
  }
  .slider:before {
    content: '';
    position: absolute;
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.2s;
  }
  .toggle input:checked + .slider { background: #2d6a4f; }
  .toggle input:checked + .slider:before { transform: translateX(20px); }

  .section {
    margin-top: 14px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    margin-bottom: 6px;
  }
  input[type="number"] {
    width: 60px;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 13px;
  }
  .domain-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
    max-height: 120px;
    overflow-y: auto;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    background: #e8e8e8;
    border-radius: 12px;
    font-size: 11px;
  }
  .chip.blocked { background: #fde2e2; color: #c0392b; }
  .chip button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    color: #999;
    padding: 0;
    line-height: 1;
  }
  .chip button:hover { color: #333; }
  .add-row {
    display: flex;
    gap: 4px;
  }
  .add-row input {
    flex: 1;
    padding: 4px 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 12px;
  }
  .add-row button {
    padding: 4px 10px;
    background: #2d6a4f;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .status {
    margin-top: 14px;
    padding: 10px;
    background: #f0f0f0;
    border-radius: 6px;
    font-size: 11px;
    color: #555;
  }
  .status strong { color: #1a1a1a; }
</style>
</head>
<body>
  <h1>Nudges</h1>
  <p class="subtitle">Maya's drift detector</p>

  <div class="toggle-row">
    <span class="toggle-label">Active</span>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <div class="section-title">Drift threshold</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="number" id="threshold" min="1" max="60" value="5">
      <span>minutes before nudge</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Allowed domains (no nudges)</div>
    <div class="domain-list" id="allowed-list"></div>
    <div class="add-row">
      <input type="text" id="allowed-input" placeholder="e.g. notion.so">
      <button id="allowed-add">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Blocked domains (urgent nudges)</div>
    <div class="domain-list" id="blocked-list"></div>
    <div class="add-row">
      <input type="text" id="blocked-input" placeholder="e.g. youtube.com">
      <button id="blocked-add">Add</button>
    </div>
  </div>

  <div class="status" id="status">Loading...</div>

  <script src="popup.js"></script>
</body>
</html>
